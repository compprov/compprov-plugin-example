name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jar
        run: mvn -B package -DskipTests

      - name: Rename jar to match release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          SRC=$(ls target/compprov-plugin-example-*.jar)
          DEST="target/compprov-plugin-example-${VERSION}.jar"
          if [ "$SRC" != "$DEST" ]; then
            cp "$SRC" "$DEST"
          fi

      - name: Upload jar to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          gh release upload "$TAG" "target/compprov-plugin-example-${VERSION}.jar" --clobber
